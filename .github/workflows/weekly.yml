name: Daily margin report

on:
  schedule:
    # UTC 08:17 = 日本時間 17:17（月〜金）
    - cron: '17 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margin-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pdfplumber==0.11.8
      - name: Generate daily report
        run: python margin_tracker.py
      - name: Save report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.md history_daily.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update daily margin report'
          git push origin HEAD:main
